services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: locapay
      POSTGRES_PASSWORD: locapay
      POSTGRES_DB: locapay_stagiaires
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  db_data:
